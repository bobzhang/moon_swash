name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 5"

jobs:
  check-and-test:
    strategy:
      fail-fast: false
      matrix:
        version: [latest, pre-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          set -eux
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.version }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Print tool versions
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Verify generated files and formatting are up-to-date
        run: |
          set -euo pipefail
          moon info --target all
          moon fmt
          git diff --exit-code

      - name: Lint and type-check (no warnings)
        run: moon check --target all --deny-warn

      - name: Run tests
        run: moon test --target all
